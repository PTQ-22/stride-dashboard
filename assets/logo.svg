<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stride logo">
  <defs>
    <linearGradient id="strideGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>
  <!-- track ring -->
  <circle cx="20" cy="20" r="18" stroke="url(#strideGrad)" stroke-width="2.5" fill="#1b1e27"/>
  <circle cx="20" cy="20" r="12.5" stroke="#2c3140" stroke-width="1.5" fill="none"/>
  <!-- stride mark: three accelerating bars forming an implied 'S' motion -->
  <path d="M13 26 q6 -4 7 -8" stroke="url(#strideGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M19 27 q6 -5 8 -12" stroke="#ffb38a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="27.5" cy="13.5" r="2.6" fill="url(#strideGrad)"/>
</svg>
